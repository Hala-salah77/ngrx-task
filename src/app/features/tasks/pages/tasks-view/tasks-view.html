<div class="max-w-2xl mx-auto mt-10 p-6 bg-gray-50 shadow-xl rounded-2xl border border-gray-100">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Elevate Tasks Manager</h1>
  </div>

  <div class="mb-5">
    <app-add-task></app-add-task>
  </div>

  <app-filter-buttons-group></app-filter-buttons-group>
  @if (loading$ | async) {
    <div class="flex items-center gap-2 text-blue-500 my-4">
      <i class="pi pi-spin pi-spinner"></i>
      <span class="text-sm">Loading tasks...</span>
    </div>
  }

  @if (error$ | async; as error) {
    <div class="my-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm border border-red-100">
      {{ error }}
    </div>
  }
  <div class="mt-2">
    <app-task-list></app-task-list>
  </div>
</div>
